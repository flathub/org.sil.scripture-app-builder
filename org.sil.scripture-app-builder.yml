# REFERENCES:
# Python2.7:  https://github.com/flathub/shared-modules/blob/cc50bdbb34cc3d29bf61cfea5e27cd980b7bda04/python2.7/python-2.7.json
# OpenJDK17: https://github.com/flathub/org.freedesktop.Sdk.Extension.openjdk17/blob/branch/26.08/org.freedesktop.Sdk.Extension.openjdk17.yaml
# Node22:    https://github.com/flathub/org.freedesktop.Sdk.Extension.node22/blob/branch/26.08/org.freedesktop.Sdk.Extension.node22.yaml
app-id: org.sil.scripture-app-builder
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17
  - org.freedesktop.Sdk.Extension.node22
finish-args:
  # Window x11 socket access
  - --socket=x11
  # Audio access
  - --socket=pulseaudio
  # Network access
  - --share=network
  # XShm access
  - --share=ipc
  # All external devices (catch all for devices we interact with and graphical acceleration)
  - --device=all
  # Local file browsing access
  - --filesystem=host
  # USB Drives
  - --system-talk-name=org.freedesktop.Udisks2
  # File saving access
  - --talk-name=org.freedesktop.FileManager1

# App's run command
command: sab-run.sh

modules:
  - name: xterm
    sources:
      - type: git
        url: https://github.com/ThomasDickey/xterm-snapshots.git
        tag: xterm-412
        commit: 5c75ead9a75d4b2e666ca06fa94503b5766ed93f
        x-checker-data:
          type: anitya
          project-id: 5272
          tag-template: xterm-$version
          is-main-source: true
    modules:
      # Added xmu for x-term
      - name: libxmu
        buildsystem: autotools
        cleanup:
          - /include
          - '*.a'
        sources:
          - type: git
            url: https://gitlab.freedesktop.org/xorg/lib/libxmu.git
            commit: cc378e4f0cc2ab5b66d378050ba4956612a01197
      - name: libXaw
        sources:
          - type: archive
            url: https://www.x.org/archive/individual/lib/libXaw-1.0.16.tar.xz
            sha256: 731d572b54c708f81e197a6afa8016918e2e06dfd3025e066ca642a5b8c39c8f
      - name: ncurses
        sources:
          - type: archive
            url: https://invisible-mirror.net/archives/ncurses/ncurses-6.6.tar.gz
            sha256: 355b4cbbed880b0381a04c46617b7656e362585d52e9cf84a67e2009b749ff11

  # needed for dido (optional installation using "Tools > Install Aeneas")
  - name: espeak-ng
    buildsystem: autotools
    cleanup:
      - '*.a'
    sources:
      - type: git
        url: https://github.com/espeak-ng/espeak-ng.git
        tag: 1.52.0
        commit: 4870adfa25b1a32b4361592f1be8a40337c58d6c
        x-checker-data:
          type: anitya
          project-id: 12958
          tag-template: $version

  # build python3-aeneas after espeak-ng (creates a symbolic link from espeak-ng to espeak and we want both available to the end user)
  - name: python3-aeneas
    buildsystem: simple
    build-commands:
      - python3 -m pip install --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "meson-python" "pyproject-metadata"
      - python3 -m pip install --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "numpy" --no-build-isolation
      # The GNOME SDK ships lxml but the Platform does not, so force it into /app
      - python3 -m pip install --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "lxml" --no-build-isolation --ignore-installed
      # Extract and patch aeneas, then repackage it for pip
      - tar -xzf aeneas-1.7.3.0.tar.gz
      - cd aeneas-1.7.3.0 && patch -p0 < ../remove-numpy-import-check.patch && cd
        ..
      - cd aeneas-1.7.3.0 && patch -p0 < ../numpy2-frombuffer.patch && cd ..
      - tar -czf aeneas-1.7.3.0-patched.tar.gz aeneas-1.7.3.0
      - python3 -m pip install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} aeneas-1.7.3.0-patched.tar.gz --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/96/62/0c1cf20fe158b0e623e78acbf5fb6de5f1410a408f65f727e4090497627b/meson_python-0.22.1-py3-none-any.whl
        sha256: 258fde948cf45aab5df23fcc9e17a9050ee73d4e1002fe6cf86519f61c414778
      - type: file
        url: https://files.pythonhosted.org/packages/b9/8e/d883718e872abc214ba053f60f7e6edc2abd5ffbd1544beb01a9c92ddd3c/pyproject_metadata-0.12.1-py3-none-any.whl
        sha256: f7162d580a96386a8eb096da06215f981f547d1490f03055ef99e323bc2da427
      - type: file
        url: https://files.pythonhosted.org/packages/e5/92/88d421001bb257588df4864ceca24d570e2e822db4f40f48737a78b648b2/aeneas-1.7.3.0.tar.gz
        sha256: b492d8ba36f12cce69c29c35e7075857a9d036c4743cc8f4689922be980826da
      - type: file
        path: patches/aeneas/remove-numpy-import-check.patch
      - type: file
        path: patches/aeneas/numpy2-frombuffer.patch
      - type: file
        url: https://files.pythonhosted.org/packages/07/66/473f7ca0be0b06e38ee8c85ee2db184e3981bd769fac2e7c19c8a8865211/soupsieve-3.0.4-py3-none-any.whl
        sha256: 8412826614f9c632227067d0985aeb9f584bd15efc852955430e097a9fe7afbf
      - type: file
        url: https://files.pythonhosted.org/packages/23/ad/28ecd7cb894d172f3c9c80a075eeeb2017ac62e3632cee05a5f9493547eb/lxml-6.1.3.tar.gz
        sha256: 45222d94ddd511536f3b2f7d9deae3b2339b4ce0f075f1ca25703b07cad9dd21
      - type: file
        url: https://files.pythonhosted.org/packages/95/b0/c7453d0b6e2073c3264468b106ee1563750cecc910965e67357e3698c83e/numpy-2.5.4.tar.gz
        sha256: 9a94cf751c9ad8ebaa835bcd3d40dacf8534ad086b88c38029b65123c7999d2a
      - type: file
        url: https://files.pythonhosted.org/packages/88/c6/92fcd42f1ba33e1184263f25bfabf3d27c383410470f169e4b8163bf9c17/beautifulsoup4-4.15.0-py3-none-any.whl
        sha256: d6f88de62e1d4e38ecb1077eb9724cd0eff29d2a08ca16a401e9b9e93f117cf9
      # beautifulsoup4 >= 4.13 requires typing-extensions
      - type: file
        url: https://files.pythonhosted.org/packages/49/d3/b8441a820a491ddfc024b0b0cf0393375b75ea13866d9c66727e54c2fc80/typing_extensions-4.16.0-py3-none-any.whl
        sha256: 481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8
    modules:
      - name: espeak
        no-autogen: true
        subdir: src
        cleanup:
          - '*.a'
        sources:
          - type: git
            url: https://salsa.debian.org/a11y-team/espeak.git
            commit: 0dd86a59e84a475bdd809a3aec7bc95a460ad5a6
          - type: patch
            path: patches/espeak/FlatpakEspeak.patch

  - name: openjdk17
    buildsystem: simple
    build-commands:
      # jre install script from extensions location
      - /usr/lib/sdk/openjdk17/install.sh
      # jdk
      - /usr/lib/sdk/openjdk17/installjdk.sh
      # symlink with version number so App Builder can find JDK version
      # similar to how version is in folder name when installed to /usr/lib/jvm
      - ln -s /app/jdk "/app/jdk$(awk -F\" '/JAVA_VERSION=/ {print $2}' /app/jdk/release)"

  - name: openjfx
    buildsystem: simple
    build-commands:
      - mkdir /app/lib/openjfx
      - unzip -q -j -d /app/lib/openjfx openjfx.zip '*lib/*'
    sources:
      - type: file
        only-arches:
          - x86_64
        dest-filename: openjfx.zip
        url: https://download2.gluonhq.com/openjfx/17.0.11/openjfx-17.0.11_linux-x64_bin-sdk.zip
        sha256: f46a1fbea32b83cca6715d74cba7d9c24ce320f1da2daf8ff852f133e9f15674

  - name: scripture-app-builder
    buildsystem: simple
    build-commands:
      # Prebuilt binaries tarball from build in the private repo
      # The source has to be private due to agreements with copyright holders of content being included by end users
      - mkdir /app/scripture-app-builder
      - tar xf scripture-app-builder.tgz -C /app/scripture-app-builder
      # Icons, desktop entry, metainfo and runner script
      - install -Dm644 /app/scripture-app-builder/app-icons/scripture-app-builder.png
        /app/share/icons/hicolor/128x128/apps/org.sil.scripture-app-builder.png
      - install -Dm644 /app/scripture-app-builder/app-icons/scripture-app-builder.svg
        /app/share/icons/hicolor/scalable/apps/org.sil.scripture-app-builder.svg
      - desktop-file-install --dir /app/share/applications /app/scripture-app-builder/flatpak/org.sil.scripture-app-builder.desktop
      - install -Dm644 /app/scripture-app-builder/flatpak/org.sil.scripture-app-builder.metainfo.xml
        -t /app/share/metainfo/
      - install -Dm755 sab-run.sh /app/bin/sab-run.sh
      # Node
      - /usr/lib/sdk/node22/install-sdk.sh
      - ln -s /app/node /app/scripture-app-builder/tools/node
    cleanup:
      - /scripture-app-builder/app-icons
      - /scripture-app-builder/flatpak
      - /scripture-app-builder/*.sh
    sources:
      - type: script
        dest-filename: sab-run.sh
        commands:
          # The downloaded aeneas-cli bundles Debian's libespeak, which looks for
          # /usr/lib/x86_64-linux-gnu/espeak-data; point it at our espeak data
          - export ESPEAK_DATA_PATH=/app/share
          - exec /app/jre/bin/java -Djava.io.tmpdir="/var/tmp" --module-path "/app/lib/openjfx"
            --add-modules javafx.web,javafx.fxml,javafx.swing,javafx.media --add-opens=javafx.fxml/javafx.fxml=ALL-UNNAMED
            -jar /app/scripture-app-builder/bin/scripture-app-builder.jar "$@"
      # App Builder prebuilt binaries (updated by flathubbot via x-checker-data)
      - type: file
        only-arches:
          - x86_64
        url: https://sil-app-builders-linux-artifacts.s3.amazonaws.com/master/160/scripture-app-builder.tgz
        sha256: dc3ad7c7defdfa3df33ba09ffaefab46a010fd437c87c2d5520d029bb3001fb8
        x-checker-data:
          type: json
          url: https://sil-app-builders-linux-artifacts.s3.amazonaws.com/latest/flatpak.json
          version-query: .scripture.version
          url-query: .scripture.url
